[package]
name = "recora"
version = "0.1.0"
description = "Recurring Payments with Escrow and Dispute Resolution on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "recora"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
anchor-debug = []
custom-heap = []
custom-panic = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "1.0.0"
anchor-spl = "1.0.0"
solana-program = "^3"
spl-token-interface = "2.0"
spl-associated-token-account-interface = "2.0"

[lints]
workspace = true

[dev-dependencies]
litesvm = "0.10.0"
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
solana-sdk = "~3.0"
bincode = "1.3.3"
